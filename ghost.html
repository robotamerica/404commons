<style>
    body {
      background: #fffdf6;
      color: #111;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      line-height: 1.6;
    }
  
    h1 {
      margin-bottom: 0.5rem;
      color: #333;
    }
  
    .puzzle-grid {
      margin-top: 2rem;
    }
  
    .row {
      display: flex;
    }
  
    .cell {
      width: 40px;
      height: 40px;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #fff;
      box-sizing: border-box;
    }
  
    .cell .number {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.6em;
      color: #999;
      pointer-events: none;
    }
  
    .cell input {
      width: 100%;
      height: 100%;
      font-size: 1.2em;
      text-align: center;
      border: none;
      outline: none;
      background: #fff;
      color: #111;
      font-family: monospace;
      box-sizing: border-box;
    }
  
    .inactive {
      background: #f0f0f0;
      border: 1px solid #eee;
    }
  
    .clues {
      margin-top: 2rem;
      text-align: left;
      max-width: 500px;
    }
  
    footer {
      margin-top: 2rem;
      font-size: 0.9em;
      color: #666;
    }
  
    button {
      background: #fafafa;
      color: #222;
      border: 1px solid #999;
      padding: 0.3em 0.6em;
      font-family: monospace;
      cursor: pointer;
    }
  </style>
  
  <script>
    function showAnswer(id, word) {
      const letters = word.split('');
      document.querySelectorAll('.' + id + ' input').forEach((el, i) => {
        el.value = letters[i] || '';
      });
    }
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <h1>Make anything you want, even a crossword</h1>
  <p><em>Drift through clues. Some may reveal themselves.</em></p>

  <div class="puzzle-grid">
    <!-- Row 1: LEAF -->
    <div class="row">
      <div class="cell h1"><input type="text" maxlength="1"><span class="number">1</span></div>
      <div class="cell h1 v2"><input type="text" maxlength="1"><span class="number">2</span></div>
      <div class="cell h1"><input type="text" maxlength="1"></div>
      <div class="cell h1"><input type="text" maxlength="1"></div>
      <div class="cell inactive"></div>
    </div>

    <!-- Row 2: C (ECHO) -->
    <div class="row">
      <div class="cell inactive"></div>
      <div class="cell v2"><input type="text" maxlength="1"></div>
      <div class="cell inactive"></div>
      <div class="cell inactive"></div>
      <div class="cell inactive"></div>
    </div>

    <!-- Row 3: HINT -->
    <div class="row">
      <div class="cell inactive"></div>
      <div class="cell v2 h3"><input type="text" maxlength="1"><span class="number">3</span></div>
      <div class="cell h3"><input type="text" maxlength="1"></div>
      <div class="cell h3"><input type="text" maxlength="1"></div>
      <div class="cell h3"><input type="text" maxlength="1"></div>
    </div>

    <!-- Row 4: O (ECHO) -->
    <div class="row">
      <div class="cell inactive"></div>
      <div class="cell v2"><input type="text" maxlength="1"></div>
      <div class="cell inactive"></div>
      <div class="cell inactive"></div>
      <div class="cell inactive"></div>
    </div>
  </div>

  <div class="clues">
    <h2>Clues</h2>
    <ul>
      <li><strong>1 Across:</strong> What grows on a branch
        <button onclick="showAnswer('h1','LEAF')">Show</button></li>
      <li><strong>2 Down:</strong> A sound that bounces back
        <button onclick="showAnswer('v2','ECHO')">Show</button></li>
      <li><strong>3 Across:</strong> A subtle clue
        <button onclick="showAnswer('h3','HINT')">Show</button></li>
    </ul>
  </div>

  <footer>
    <p><a href="index.html">← Back to Grove</a></p>
  </footer>

</body>
</html>
